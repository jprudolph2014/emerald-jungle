<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Emerald Jungle — Official Theme Song</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 15%,#335e45,#0a2018 65%,#06130e);color:#efe5ca;font:16px system-ui}main{width:min(92vw,500px);background:#142c23;border:1px solid #50765a;border-radius:22px;padding:30px;text-align:center;box-shadow:0 20px 80px #0006}h1{font:bold clamp(28px,6vw,40px) Georgia;margin:12px 0;color:#e9d18c}p{color:#b0c7b4;line-height:1.5}svg{width:100%;border-radius:14px}audio{width:100%;margin:15px 0}small{display:block;margin-top:20px;color:#a8b9a9;letter-spacing:.12em}button,a{display:inline-block;background:#e2c47b;color:#142c23;border:0;border-radius:8px;padding:12px 16px;font:700 14px system-ui;text-decoration:none;cursor:pointer;margin:4px}label{display:block;margin:10px;color:#c6d6c8}#status{font-size:13px;min-height:1em}</style></head><body><main><svg viewBox="0 0 360 210" role="img" aria-label="Glowing emerald in a mysterious jungle"><defs><radialGradient id="g"><stop stop-color="#a8e99b"/><stop offset="1" stop-color="#143d30"/></radialGradient></defs><rect width="360" height="210" fill="url(#g)"/><path d="M0 140Q40 70 95 130T185 120T275 135L360 85V210H0Z" fill="#315a3c"/><path d="M0 0H95L45 42 28 210H8L14 35ZM360 0H265L315 42 332 210H352L346 35Z" fill="#0b241a"/><path d="M0 210Q20 125 90 155Q70 105 120 130L145 210M360 210Q330 125 270 155Q290 105 240 130L215 210" fill="#122e21"/><path d="M180 40L220 82 204 136 180 164 156 136 140 82Z" fill="#169b58" stroke="#c0f8cb" stroke-width="2"/><path d="M180 40L194 82 180 164 166 82Z" fill="#91e4ab"/><path d="M140 82H220M156 136L166 82M204 136L194 82" fill="none" stroke="#c0f8cb" opacity=".7"/></svg><small>OFFICIAL THEME SONG</small><h1>The Emerald Jungle</h1><p>Rise of Poth · The song of the expedition</p><audio id="song" controls preload="metadata" src="The%20Emerald%20Jungle.mp3">Your browser does not support audio playback.</audio><label><input type="checkbox" id="loop"> Repeat song</label><button id="restart">Restart song</button><button id="share">Copy song link</button><a href="./">Play the game</a><p id="status" aria-live="polite"></p></main><script>const a=document.getElementById('song'),s=document.getElementById('status');document.getElementById('loop').onchange=e=>a.loop=e.target.checked;document.getElementById('restart').onclick=()=>{a.currentTime=0;a.play().catch(()=>s.textContent='Press play to begin.');};document.getElementById('share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);s.textContent='Link copied!'}catch(e){s.textContent='Copy the address from your browser.'}};a.addEventListener('error',()=>s.textContent='Audio could not load. Please refresh the page.');</script></body></html>
